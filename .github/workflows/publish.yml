name: Publish

# Publishes Dytools.DeployTool to NuGet.org when a GitHub Release is published.
# The package version is taken from the release tag, e.g. tag "v1.2.0" -> version 1.2.0.
#
# Requires a repository secret named NUGET_API_KEY (an API key from nuget.org
# with push rights for the Dytools.DeployTool package / the Dytools.* prefix).

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from release tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: dotnet test -c Release

      - name: Pack
        run: >
          dotnet pack src/Dytools.DeployTool/Dytools.DeployTool.csproj
          -c Release
          -o artifacts
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
